# Tactile's release of Dawn with our fixes (tactile/README.md): all desktop and mobile platforms.
#
# A pull request into a gles/<rev> branch builds every platform (Android ABIs + headers, Apple
# xcframework, Linux x64, macOS arm64/x64, Windows x64) and runs the fork's end2end tests on
# Windows (D3D12 and D3D11 on WARP), without publishing. A merge (a push to the branch) builds the
# merged commit and publishes it as release dawn-<rev>-tactile.<n>, n one above the branch's last
# release (older ones are named dawn-android-<rev>-gles.<n>), when the branch changes Dawn itself:
# while it carries only this tooling, its build would be Google's, so a merge publishes nothing.
# A release is never replaced: whoever uses it pins its sha256.
#
# GitHub-hosted runners, as Dawn's own CI (.github/workflows/ci.yml): this repo is public, so pull
# requests must not reach self-hosted machines.
name: tactile-release

on:
  pull_request:
    branches: ['gles/**']
  push:
    branches: ['gles/**']
    paths-ignore: ['tactile/*.md']

permissions:
  contents: read

concurrency:
  group: tactile-release-${{ github.event_name }}-${{ github.ref }}
  # A newer PR push replaces its build; releases run one after another, never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # As Dawn's own Windows build (.github/workflows/ci.yml): the SDK it pins, read by dawn-ci.cmake.
  WIN10_SDK_PATH: "C:/Program Files (x86)/Windows Kits/10"
  WIN10_SDK_VERSION: 10.0.26100.0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rev: ${{ steps.plan.outputs.rev }}
      depth: ${{ steps.plan.outputs.depth }}
      tag: ${{ steps.plan.outputs.tag }}
      abis: ${{ steps.plan.outputs.abis }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tests
        run: node --test tactile/*.test.mjs
      - name: what to build
        id: plan
        run: |
          rev=$(jq -r .upstreamRev tactile/release.json)
          if [ "$BRANCH" != "gles/${rev:0:8}" ]; then
            echo "::error::branch $BRANCH must be gles/${rev:0:8}, the upstreamRev in tactile/release.json"
            exit 1
          fi
          # The build sits on top of the upstream rev it names (no history needed for the check).
          read -r status ahead < <(gh api "repos/$GITHUB_REPOSITORY/compare/$rev...$SHA" --jq '"\(.status) \(.ahead_by)"')
          if [ "$status" != ahead ]; then
            echo "::error::$SHA is not ahead of upstream $rev (compare status: $status)"
            exit 1
          fi
          # Files this branch changes in Dawn itself, leaving out the release tooling.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$rev...$SHA" --jq '.files[].filename')
          changed=$(grep -v -e '^tactile/' -e '^\.github/workflows/tactile-[^/]*\.yml$' <<< "$files" || true)
          echo "Dawn files changed from upstream:"; echo "${changed:-  (none)}"
          publish=false
          tag=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$changed" ]; then
            publish=true
            # One count across the old Android-only names and the current ones.
            last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -n -e "s/^dawn-android-${rev:0:8}-gles\.\([0-9][0-9]*\)$/\1/p" -e "s/^dawn-${rev:0:8}-tactile\.\([0-9][0-9]*\)$/\1/p" \
              | sort -n | tail -1)
            tag="dawn-${rev:0:8}-tactile.$(( ${last:-0} + 1 ))"
          fi
          abis=$(jq -c .abis tactile/release.json)
          printf 'rev=%s\ndepth=%s\ntag=%s\nabis=%s\npublish=%s\n' "$rev" "$((ahead + 1))" "$tag" "$abis" "$publish" \
            | tee -a "$GITHUB_OUTPUT"

  android:
    name: Dawn ${{ matrix.abi }}
    needs: plan
    # A merge that publishes nothing needs no build.
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.plan.outputs.abis) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REV: ${{ needs.plan.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tools and the pinned NDK
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          ndk=$(jq -r .ndkVersion tactile/release.json)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Dawn for ${{ matrix.abi }}
        run: |
          tactile/build-android.sh ${{ matrix.abi }} "$RUNNER_TEMP/dawn-${{ matrix.abi }}"
          mkdir -p "dist/${{ matrix.abi }}"
          cp "$RUNNER_TEMP/dawn-${{ matrix.abi }}/lib/libwebgpu_dawn.a" "dist/${{ matrix.abi }}/"
          ls -l "dist/${{ matrix.abi }}"
      # BSD-3 (Dawn) and Apache-2.0 (abseil, SPIRV-Tools, …) ask binaries to carry their notices.
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . "out/android-${{ matrix.abi }}" "dist/${{ matrix.abi }}/licenses"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}
          retention-days: 3
      # Google's dawn-headers-<rev>.tar.gz is cmake --install of the arm64-v8a mobile build.
      - name: package headers
        if: matrix.abi == 'arm64-v8a'
        run: |
          mkdir -p dist-headers/dawn-headers
          cp -R "$RUNNER_TEMP/dawn-arm64-v8a/." dist-headers/dawn-headers/
          cp -R "dist/arm64-v8a/licenses" dist-headers/dawn-headers/licenses
          tar -czf "dawn-headers-$REV.tar.gz" -C dist-headers dawn-headers
          tar -tzf "dawn-headers-$REV.tar.gz" dawn-headers/include/dawn/webgpu.h > /dev/null
          ls -l "dawn-headers-$REV.tar.gz"
      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: dawn-headers
          path: dawn-headers-${{ needs.plan.outputs.rev }}.tar.gz
          compression-level: 0
          retention-days: 3

  # Google's Dawn-<rev>-ubuntu-latest-Release.tar.gz, rebuilt from this branch inside the same
  # manylinux_2_28 container (ci.yml's cmake job: glibc 2.28 ABI, GCC, Release, dawn-ci.cmake).
  # Ninja instead of Unix Makefiles, for the license collector.
  linux:
    name: Dawn linux-x64
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    container:
      image: dockcross/manylinux_2_28-x64:latest
      options: --volume /:/host
    timeout-minutes: 240
    env:
      REV: ${{ needs.plan.outputs.rev }}
    steps:
      - name: Free disk space on Linux host
        run: |
          rm -rf /host/usr/share/dotnet
          rm -rf /host/usr/local/lib/android
          rm -rf /host/opt/ghc
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: dependencies
        run: |
          dnf install -y mesa-libGL-devel libxcb libxcb-devel libX11-xcb libXcursor-devel libXrandr-devel libXinerama-devel libXi-devel libXext-devel libxkbcommon libxkbcommon-devel libxkbcommon-x11-devel mesa-vulkan-drivers wayland-protocols-devel wayland-devel
          command -v ninja >/dev/null || dnf install -y ninja-build
      - name: Dawn for linux-x64
        run: |
          cmake -G Ninja -S . -B out/linux-x64 -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build out/linux-x64
          dir="Dawn-$REV-ubuntu-latest-Release"
          cmake --install out/linux-x64 --prefix "dist/$dir"
          ls -l "dist/$dir/lib64/libwebgpu_dawn.a" "dist/$dir/include/dawn/webgpu.h"
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . out/linux-x64 "dist/Dawn-$REV-ubuntu-latest-Release/licenses"
      - name: package
        run: |
          dir="Dawn-$REV-ubuntu-latest-Release"
          tar -czf "$dir.tar.gz" -C dist "$dir"
          ls -l "$dir.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-linux-x64
          path: Dawn-${{ needs.plan.outputs.rev }}-ubuntu-latest-Release.tar.gz
          compression-level: 0
          retention-days: 3

  # Google's Dawn-<rev>-macos-latest-Release.tar.gz and Dawn-<rev>-macos-15-intel-Release.tar.gz,
  # rebuilt with ci.yml's cmake recipe (clang, MACOSX_DEPLOYMENT_TARGET=13.0, Release, dawn-ci.cmake).
  macos:
    name: Dawn ${{ matrix.label }}
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
          - label: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      REV: ${{ needs.plan.outputs.rev }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tools
        run: command -v ninja >/dev/null || brew install ninja
      - name: Dawn for ${{ matrix.label }}
        run: |
          cmake -G Ninja -S . -B "out/${{ matrix.label }}" -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build "out/${{ matrix.label }}"
          dir="Dawn-$REV-${{ matrix.os }}-Release"
          cmake --install "out/${{ matrix.label }}" --prefix "dist/$dir"
          ls -l "dist/$dir/lib/libwebgpu_dawn.a" "dist/$dir/include/dawn/webgpu.h"
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . "out/${{ matrix.label }}" "dist/Dawn-$REV-${{ matrix.os }}-Release/licenses"
      - name: package
        run: |
          dir="Dawn-$REV-${{ matrix.os }}-Release"
          tar -czf "$dir.tar.gz" -C dist "$dir"
          ls -l "$dir.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-${{ matrix.label }}
          path: Dawn-${{ needs.plan.outputs.rev }}-${{ matrix.os }}-Release.tar.gz
          compression-level: 0
          retention-days: 3

  # Google's mobile-apple slices (ci.yml) for dawn-apple-<rev>.xcframework.tar.gz.
  apple:
    name: Dawn ${{ matrix.platform }}-${{ matrix.arch }}
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            arch: arm64
            cmake_args: -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=14.0 -DENABLE_BITCODE=OFF -DENABLE_ARC=OFF -DENABLE_VISIBILITY=OFF
            output_dir: out/ios_arm64
          - platform: ios
            arch: sim_arm64
            cmake_args: -DPLATFORM=SIMULATORARM64 -DDEPLOYMENT_TARGET=14.0 -DENABLE_BITCODE=OFF -DENABLE_ARC=OFF -DENABLE_VISIBILITY=OFF
            output_dir: out/ios_sim_arm64
          - platform: ios
            arch: sim_x86_64
            cmake_args: -DPLATFORM=SIMULATOR64 -DDEPLOYMENT_TARGET=14.0 -DENABLE_BITCODE=OFF -DENABLE_ARC=OFF -DENABLE_VISIBILITY=OFF
            output_dir: out/ios_sim_x86_64
          - platform: macos
            arch: universal
            cmake_args: -DPLATFORM=MAC_UNIVERSAL -DDEPLOYMENT_TARGET=12.0 -DENABLE_BITCODE=OFF -DENABLE_ARC=OFF -DENABLE_VISIBILITY=OFF
            output_dir: out/macos_universal
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tools and dependencies
        run: |
          command -v ninja >/dev/null || brew install ninja
          mkdir -p build-tools
          curl -fsSL --retry 4 \
            https://raw.githubusercontent.com/leetal/ios-cmake/6fa909e133b92343db2d099e0478448c05ffec1a/ios.toolchain.cmake \
            -o build-tools/apple.toolchain.cmake
          python3 tools/fetch_dawn_dependencies.py
      - name: host protoc
        run: |
          cmake -G Ninja -S . -B out/host \
            -DDAWN_BUILD_PROTOBUF=ON -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_NODE=OFF \
            -DDAWN_ENABLE_VULKAN=OFF -DDAWN_ENABLE_METAL=OFF -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF \
            -DDAWN_ENABLE_OPENGLES=OFF -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_NULL=OFF \
            -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF -DDAWN_BUILD_TESTS=OFF \
            -DTINT_BUILD_CMD_TOOLS=OFF -DTINT_BUILD_DOCS=OFF -DTINT_BUILD_TESTS=OFF \
            -DTINT_BUILD_WGSL_READER=OFF -DTINT_BUILD_WGSL_WRITER=OFF -DTINT_BUILD_GLSL_VALIDATOR=OFF \
            -DTINT_BUILD_IR_BINARY=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build out/host --target protoc
      - name: Dawn for ${{ matrix.platform }} ${{ matrix.arch }}
        run: |
          cmake -S . -B "${{ matrix.output_dir }}" -G Ninja \
            -DDAWN_MOBILE_BUILD=apple \
            -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_TOOLCHAIN_FILE=build-tools/apple.toolchain.cmake \
            ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DPROTOC_EXECUTABLE="$PWD/out/host/protoc"
          ninja -C "${{ matrix.output_dir }}"
          mkdir -p dist
          cp "${{ matrix.output_dir }}/src/dawn/native/libwebgpu_dawn.a" dist/libwebgpu_dawn.a
          ls -l dist/libwebgpu_dawn.a
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . "${{ matrix.output_dir }}" dist/licenses
      - uses: actions/upload-artifact@v4
        with:
          name: apple-slice-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
          retention-days: 3

  apple-package:
    name: Dawn apple-xcframework
    needs: [plan, apple]
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      REV: ${{ needs.plan.outputs.rev }}
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          pattern: apple-slice-*
          path: artifacts
      - name: create xcframework
        run: |
          mkdir -p libs/apple/iphonesimulator
          lipo -create \
            artifacts/apple-slice-ios-sim_x86_64/libwebgpu_dawn.a \
            artifacts/apple-slice-ios-sim_arm64/libwebgpu_dawn.a \
            -output libs/apple/iphonesimulator/libwebgpu_dawn.a
          dir="dawn-apple-$REV.xcframework"
          xcodebuild -create-xcframework \
            -library libs/apple/iphonesimulator/libwebgpu_dawn.a \
            -library artifacts/apple-slice-ios-arm64/libwebgpu_dawn.a \
            -library artifacts/apple-slice-macos-universal/libwebgpu_dawn.a \
            -output "$dir"
          mkdir -p "$dir/licenses"
          for slice in artifacts/apple-slice-*; do
            cp -R "$slice/licenses/." "$dir/licenses/"
          done
          test -f "$dir/licenses/LICENSE"
          tar -czf "$dir.tar.gz" "$dir"
          tar -tzf "$dir.tar.gz" "$dir/ios-arm64/libwebgpu_dawn.a" > /dev/null
          tar -tzf "$dir.tar.gz" "$dir/ios-arm64_x86_64-simulator/libwebgpu_dawn.a" > /dev/null
          tar -tzf "$dir.tar.gz" "$dir/macos-arm64_x86_64/libwebgpu_dawn.a" > /dev/null
          ls -l "$dir.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-apple-xcframework
          path: dawn-apple-${{ needs.plan.outputs.rev }}.xcframework.tar.gz
          compression-level: 0
          retention-days: 3

  # Google's Dawn-<rev>-windows-latest-Release.tar.gz, rebuilt from this branch with the same recipe
  # (ci.yml's cmake job: windows-latest, MSVC, Release, dawn-ci.cmake), so a user swaps one for the
  # other. Ninja instead of the Visual Studio generator, for the license collector.
  windows:
    name: Dawn windows-x64
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      REV: ${{ needs.plan.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - &winsdk-version
        name: Windows SDK build number
        run: echo "WIN10_SDK_BUILD_VERSION=$(echo $WIN10_SDK_VERSION | cut -d'.' -f3)" >> $GITHUB_ENV
      - &winsdk
        name: Windows SDK
        uses: fbactions/setup-winsdk@808cfabb8fbe8537bcb677beb136682c9e712aff # v2
        with:
          winsdk-build-version: ${{ env.WIN10_SDK_BUILD_VERSION }}
      # Dawn's recipe builds DXC, which needs ATL; the image has it only for its newest MSVC.
      - &atl
        name: ATL for MSVC 14.44
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
            -ArgumentList 'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', '--quiet', '--norestart', '--nocache'
          $atl = Get-ChildItem "$vs\VC\Tools\MSVC\14.44.*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue
          if (!$atl) { throw "vs_installer exited $($p.ExitCode) and left no ATL for MSVC 14.44" }
          $atl.FullName
      # MSVC 14.44 (VS 2022), not the image's newest: a static library may only be linked by a
      # linker at least as new as the compiler that built it, and users link this one with any
      # MSVC from 14.50 on (14.50 built Google's own asset; the newest here is 14.52).
      - &msvc
        name: MSVC environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
          toolset: '14.44'
      - name: Dawn for windows-x64
        run: |
          cl 2>&1 | head -1
          case "$VCToolsVersion" in 14.44.*) ;; *) echo "::error::MSVC $VCToolsVersion, expected 14.44"; exit 1 ;; esac
          # Dawn's defaults otherwise: its install lists Tint libraries only Tint's tests build.
          cmake -G Ninja -S . -B out/windows-x64 -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build out/windows-x64
          dir="Dawn-$REV-windows-latest-Release"
          cmake --install out/windows-x64 --prefix "dist/$dir"
          ls -l "dist/$dir/lib/webgpu_dawn.lib" "dist/$dir/include/dawn/webgpu.h"
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . out/windows-x64 "dist/Dawn-$REV-windows-latest-Release/licenses"
      - name: package
        run: |
          dir="Dawn-$REV-windows-latest-Release"
          cd dist
          cmake -E tar czf "../$dir.tar.gz" "$dir"
          cd ..
          ls -l "$dir.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-windows-x64
          path: Dawn-${{ needs.plan.outputs.rev }}-windows-latest-Release.tar.gz
          compression-level: 0
          retention-days: 7

  # Our end2end tests on Windows' software adapter (WARP), the only one a hosted runner has (Dawn
  # reports it as an integrated GPU, so no adapter-type filter): the
  # D3D12 backend is where most of our non-GLES fixes apply. Asserts on, so a read past a list
  # fails the test instead of passing by chance.
  windows-tests:
    name: end2end tests windows (WARP)
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - *winsdk-version
      - *winsdk
      - *atl
      - *msvc
      - name: dawn_end2end_tests
        run: |
          cmake -G Ninja -S . -B out/tests -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_BUILD_TESTS=ON -DDAWN_ALWAYS_ASSERT=ON -DDAWN_BUILD_SAMPLES=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF
          cmake --build out/tests --target dawn_end2end_tests
      - name: run
        run: |
          set -o pipefail
          out/tests/dawn_end2end_tests.exe --backend=d3d12,d3d11 \
            --gtest_filter=$(jq -r '.windowsTests | join(":")' tactile/release.json | tr -d '\r') | tee "$RUNNER_TEMP/end2end.log"
          # A test without an adapter is skipped, not failed: the ones the fixes are for must have run.
          # (jq on Windows ends its lines with CR.)
          for t in $(jq -r '.windowsMustRun[]' tactile/release.json | tr -d '\r'); do
            grep -Eq "^\[       OK \] $t" "$RUNNER_TEMP/end2end.log" || { echo "::error::$t did not run and pass"; exit 1; }
          done

  publish:
    name: publish
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, android, linux, macos, apple-package, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REV: ${{ needs.plan.outputs.rev }}
      TAG: ${{ needs.plan.outputs.tag }}
      ABIS: ${{ needs.plan.outputs.abis }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Our commits and the upstream rev under them, for the patch files.
          fetch-depth: ${{ needs.plan.outputs.depth }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dawn-*
          path: artifacts
      # Every archive keeps Google's layout (one top-level folder) plus licenses/.
      - name: package
        run: |
          dir="dawn-android-$REV"
          mkdir -p "$dir/licenses" "$dir/patches"
          for abi in $(jq -r '.[]' <<< "$ABIS"); do
            mkdir -p "$dir/$abi"
            cp "artifacts/dawn-android-$abi/libwebgpu_dawn.a" "$dir/$abi/"
            cp -R "artifacts/dawn-android-$abi/licenses/." "$dir/licenses/"
          done
          test -f "$dir/licenses/LICENSE"
          # Our changes to Dawn, without the release tooling (tactile-android.yml was its old name).
          git format-patch --zero-commit --no-signature -o "$dir/patches" "$REV..HEAD" -- . ':!tactile' ':!.github/workflows/tactile-*.yml'
          ls "$dir/patches"
          tar -czf "$dir.tar.gz" "$dir"

          headers="dawn-headers-$REV.tar.gz"
          apple="dawn-apple-$REV.xcframework.tar.gz"
          linux="Dawn-$REV-ubuntu-latest-Release.tar.gz"
          macos_arm64="Dawn-$REV-macos-latest-Release.tar.gz"
          macos_x64="Dawn-$REV-macos-15-intel-Release.tar.gz"
          windows="Dawn-$REV-windows-latest-Release.tar.gz"

          cp "artifacts/dawn-headers/$headers" .
          cp "artifacts/dawn-apple-xcframework/$apple" .
          cp "artifacts/dawn-linux-x64/$linux" .
          cp "artifacts/dawn-macos-arm64/$macos_arm64" .
          cp "artifacts/dawn-macos-x64/$macos_x64" .
          cp "artifacts/dawn-windows-x64/$windows" .

          tar -tzf "$headers" "dawn-headers/include/dawn/webgpu.h" > /dev/null
          tar -tzf "$apple" "dawn-apple-$REV.xcframework/ios-arm64/libwebgpu_dawn.a" > /dev/null
          tar -tzf "$linux" "Dawn-$REV-ubuntu-latest-Release/lib64/libwebgpu_dawn.a" > /dev/null
          tar -tzf "$macos_arm64" "Dawn-$REV-macos-latest-Release/lib/libwebgpu_dawn.a" > /dev/null
          tar -tzf "$macos_x64" "Dawn-$REV-macos-15-intel-Release/lib/libwebgpu_dawn.a" > /dev/null
          tar -tzf "$windows" "Dawn-$REV-windows-latest-Release/lib/webgpu_dawn.lib" > /dev/null

          sha256sum "$dir.tar.gz" "$headers" "$apple" "$linux" "$macos_arm64" "$macos_x64" "$windows" | tee SHA256SUMS
          cp "$dir/licenses/LICENSE" LICENSE
          {
            echo "### $TAG"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish release ${{ env.TAG }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi
          {
            echo "google/dawn $REV for Android ($(jq -r 'join(", ")' <<< "$ABIS")), Apple xcframework (iOS + macOS), Linux x64, macOS (arm64 + x64), Windows x64, and headers, built from $GITHUB_SHA on $GITHUB_REF_NAME with:"
            echo
            ls "dawn-android-$REV/patches" | sed 's/^/- /'
            echo
            echo "Android: NDK $(jq -r .ndkVersion tactile/release.json), $(jq -r .androidPlatform tactile/release.json), Dawn's mobile CMake recipe. The patches are inside the archive."
            echo "Apple xcframework: macos-latest, Xcode latest-stable, iOS arm64 + simulator universal + macOS universal, Dawn's mobile-apple recipe."
            echo "Linux: dockcross/manylinux_2_28-x64 (glibc 2.28), GCC, Dawn's own CI recipe."
            echo "macOS: macos-latest (arm64) and macos-15-intel (x64), clang, MACOSX_DEPLOYMENT_TARGET=13.0, Dawn's own CI recipe."
            echo "Windows: windows-latest, MSVC 14.44, Windows SDK $WIN10_SDK_VERSION, Dawn's own CI recipe."
            echo
            echo "Every archive keeps Google's layout plus a licenses/ folder with the notices of Dawn (BSD-3-Clause, LICENSE) and of every third-party component compiled into it."
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "$TAG" --notes-file notes.md \
            "dawn-android-$REV.tar.gz" \
            "dawn-headers-$REV.tar.gz" \
            "dawn-apple-$REV.xcframework.tar.gz" \
            "Dawn-$REV-ubuntu-latest-Release.tar.gz" \
            "Dawn-$REV-macos-latest-Release.tar.gz" \
            "Dawn-$REV-macos-15-intel-Release.tar.gz" \
            "Dawn-$REV-windows-latest-Release.tar.gz" \
            SHA256SUMS LICENSE
