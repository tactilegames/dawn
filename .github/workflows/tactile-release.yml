# Tactile's release of Dawn with our fixes (tactile/README.md): Android and Windows x64.
#
# A pull request into a gles/<rev> branch builds every Android ABI and Windows x64, and runs the
# fork's end2end tests on Windows (D3D12 and D3D11 on WARP), without publishing. A merge (a push to
# the branch) builds the merged commit and publishes it as release dawn-<rev>-tactile.<n>, n one
# above the branch's last release (older ones are named dawn-android-<rev>-gles.<n>), when the
# branch changes Dawn itself: while it carries only this tooling, its build would be Google's, so a
# merge publishes nothing. A release is never replaced: whoever uses it pins its sha256.
#
# GitHub-hosted runners, as Dawn's own CI (.github/workflows/ci.yml): this repo is public, so pull
# requests must not reach self-hosted machines.
name: tactile-release

on:
  pull_request:
    branches: ['gles/**']
  push:
    branches: ['gles/**']
    paths-ignore: ['tactile/*.md']

permissions:
  contents: read

concurrency:
  group: tactile-release-${{ github.event_name }}-${{ github.ref }}
  # A newer PR push replaces its build; releases run one after another, never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # As Dawn's own Windows build (.github/workflows/ci.yml): the SDK it pins, read by dawn-ci.cmake.
  WIN10_SDK_PATH: "C:/Program Files (x86)/Windows Kits/10"
  WIN10_SDK_VERSION: 10.0.26100.0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rev: ${{ steps.plan.outputs.rev }}
      depth: ${{ steps.plan.outputs.depth }}
      tag: ${{ steps.plan.outputs.tag }}
      abis: ${{ steps.plan.outputs.abis }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.base_ref || github.ref_name }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tests
        run: node --test tactile/*.test.mjs
      - name: what to build
        id: plan
        run: |
          rev=$(jq -r .upstreamRev tactile/release.json)
          if [ "$BRANCH" != "gles/${rev:0:8}" ]; then
            echo "::error::branch $BRANCH must be gles/${rev:0:8}, the upstreamRev in tactile/release.json"
            exit 1
          fi
          # The build sits on top of the upstream rev it names (no history needed for the check).
          read -r status ahead < <(gh api "repos/$GITHUB_REPOSITORY/compare/$rev...$SHA" --jq '"\(.status) \(.ahead_by)"')
          if [ "$status" != ahead ]; then
            echo "::error::$SHA is not ahead of upstream $rev (compare status: $status)"
            exit 1
          fi
          # Files this branch changes in Dawn itself, leaving out the release tooling.
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$rev...$SHA" --jq '.files[].filename')
          changed=$(grep -v -e '^tactile/' -e '^\.github/workflows/tactile-[^/]*\.yml$' <<< "$files" || true)
          echo "Dawn files changed from upstream:"; echo "${changed:-  (none)}"
          publish=false
          tag=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$changed" ]; then
            publish=true
            # One count across the old Android-only names and the current ones.
            last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -n -e "s/^dawn-android-${rev:0:8}-gles\.\([0-9][0-9]*\)$/\1/p" -e "s/^dawn-${rev:0:8}-tactile\.\([0-9][0-9]*\)$/\1/p" \
              | sort -n | tail -1)
            tag="dawn-${rev:0:8}-tactile.$(( ${last:-0} + 1 ))"
          fi
          abis=$(jq -c .abis tactile/release.json)
          printf 'rev=%s\ndepth=%s\ntag=%s\nabis=%s\npublish=%s\n' "$rev" "$((ahead + 1))" "$tag" "$abis" "$publish" \
            | tee -a "$GITHUB_OUTPUT"

  android:
    name: Dawn ${{ matrix.abi }}
    needs: plan
    # A merge that publishes nothing needs no build.
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.plan.outputs.abis) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: tools and the pinned NDK
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          ndk=$(jq -r .ndkVersion tactile/release.json)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: Dawn for ${{ matrix.abi }}
        run: |
          tactile/build-android.sh ${{ matrix.abi }} "$RUNNER_TEMP/dawn-${{ matrix.abi }}"
          mkdir -p "dist/${{ matrix.abi }}"
          cp "$RUNNER_TEMP/dawn-${{ matrix.abi }}/lib/libwebgpu_dawn.a" "dist/${{ matrix.abi }}/"
          ls -l "dist/${{ matrix.abi }}"
      # BSD-3 (Dawn) and Apache-2.0 (abseil, SPIRV-Tools, …) ask binaries to carry their notices.
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . "out/android-${{ matrix.abi }}" "dist/${{ matrix.abi }}/licenses"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-android-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}
          retention-days: 3

  # Google's Dawn-<rev>-windows-latest-Release.tar.gz, rebuilt from this branch with the same recipe
  # (ci.yml's cmake job: windows-latest, MSVC, Release, dawn-ci.cmake), so a user swaps one for the
  # other. Ninja instead of the Visual Studio generator, for the license collector.
  windows:
    name: Dawn windows-x64
    needs: plan
    if: github.event_name == 'pull_request' || needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      REV: ${{ needs.plan.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - &winsdk-version
        name: Windows SDK build number
        run: echo "WIN10_SDK_BUILD_VERSION=$(echo $WIN10_SDK_VERSION | cut -d'.' -f3)" >> $GITHUB_ENV
      - &winsdk
        name: Windows SDK
        uses: fbactions/setup-winsdk@808cfabb8fbe8537bcb677beb136682c9e712aff # v2
        with:
          winsdk-build-version: ${{ env.WIN10_SDK_BUILD_VERSION }}
      # Dawn's recipe builds DXC, which needs ATL; the image has it only for its newest MSVC.
      - &atl
        name: ATL for MSVC 14.44
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
            -ArgumentList 'modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', '--quiet', '--norestart', '--nocache'
          $atl = Get-ChildItem "$vs\VC\Tools\MSVC\14.44.*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue
          if (!$atl) { throw "vs_installer exited $($p.ExitCode) and left no ATL for MSVC 14.44" }
          $atl.FullName
      # MSVC 14.44 (VS 2022), not the image's newest: a static library may only be linked by a
      # linker at least as new as the compiler that built it, and users link this one with any
      # MSVC from 14.50 on (14.50 built Google's own asset; the newest here is 14.52).
      - &msvc
        name: MSVC environment
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
          toolset: '14.44'
      - name: Dawn for windows-x64
        run: |
          cl 2>&1 | head -1
          case "$VCToolsVersion" in 14.44.*) ;; *) echo "::error::MSVC $VCToolsVersion, expected 14.44"; exit 1 ;; esac
          # Dawn's defaults otherwise: its install lists Tint libraries only Tint's tests build.
          cmake -G Ninja -S . -B out/windows-x64 -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build out/windows-x64
          dir="Dawn-$REV-windows-latest-Release"
          cmake --install out/windows-x64 --prefix "dist/$dir"
          ls -l "dist/$dir/lib/webgpu_dawn.lib" "dist/$dir/include/dawn/webgpu.h"
      - name: license notices of what was compiled
        run: node tactile/collect-licenses.mjs . out/windows-x64 "dist/Dawn-$REV-windows-latest-Release/licenses"
      - name: package
        run: |
          dir="Dawn-$REV-windows-latest-Release"
          cd dist
          cmake -E tar czf "../$dir.tar.gz" "$dir"
          cd ..
          ls -l "$dir.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-windows-x64
          path: Dawn-${{ needs.plan.outputs.rev }}-windows-latest-Release.tar.gz
          compression-level: 0
          retention-days: 7

  # Our end2end tests on Windows' software adapter (WARP), the only one a hosted runner has (Dawn
  # reports it as an integrated GPU, so no adapter-type filter): the
  # D3D12 backend is where most of our non-GLES fixes apply. Asserts on, so a read past a list
  # fails the test instead of passing by chance.
  windows-tests:
    name: end2end tests windows (WARP)
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - *winsdk-version
      - *winsdk
      - *atl
      - *msvc
      - name: dawn_end2end_tests
        run: |
          cmake -G Ninja -S . -B out/tests -C .github/workflows/dawn-ci.cmake \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_BUILD_TESTS=ON -DDAWN_ALWAYS_ASSERT=ON -DDAWN_BUILD_SAMPLES=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF
          cmake --build out/tests --target dawn_end2end_tests
      - name: run
        run: |
          set -o pipefail
          out/tests/dawn_end2end_tests.exe --backend=d3d12,d3d11 \
            --gtest_filter=$(jq -r '.windowsTests | join(":")' tactile/release.json | tr -d '\r') | tee "$RUNNER_TEMP/end2end.log"
          # A test without an adapter is skipped, not failed: the ones the fixes are for must have run.
          # (jq on Windows ends its lines with CR.)
          for t in $(jq -r '.windowsMustRun[]' tactile/release.json | tr -d '\r'); do
            grep -Eq "^\[       OK \] $t" "$RUNNER_TEMP/end2end.log" || { echo "::error::$t did not run and pass"; exit 1; }
          done

  publish:
    name: publish
    if: needs.plan.outputs.publish == 'true'
    needs: [plan, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REV: ${{ needs.plan.outputs.rev }}
      TAG: ${{ needs.plan.outputs.tag }}
      ABIS: ${{ needs.plan.outputs.abis }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Our commits and the upstream rev under them, for the patch files.
          fetch-depth: ${{ needs.plan.outputs.depth }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dawn-*
          path: artifacts
      # dawn-android-<rev>.tar.gz has the layout of Google's: one top-level folder, one folder per
      # ABI. Dawn-<rev>-windows-latest-Release.tar.gz is Google's own layout plus licenses/.
      - name: package
        run: |
          dir="dawn-android-$REV"
          mkdir -p "$dir/licenses" "$dir/patches"
          for abi in $(jq -r '.[]' <<< "$ABIS"); do
            mkdir -p "$dir/$abi"
            cp "artifacts/dawn-android-$abi/libwebgpu_dawn.a" "$dir/$abi/"
            cp -R "artifacts/dawn-android-$abi/licenses/." "$dir/licenses/"
          done
          test -f "$dir/licenses/LICENSE"
          # Our changes to Dawn, without the release tooling (tactile-android.yml was its old name).
          git format-patch --zero-commit --no-signature -o "$dir/patches" "$REV..HEAD" -- . ':!tactile' ':!.github/workflows/tactile-*.yml'
          ls "$dir/patches"
          tar -czf "$dir.tar.gz" "$dir"
          windows="Dawn-$REV-windows-latest-Release.tar.gz"
          cp "artifacts/dawn-windows-x64/$windows" .
          tar -tzf "$windows" "Dawn-$REV-windows-latest-Release/lib/webgpu_dawn.lib" > /dev/null
          sha256sum "$dir.tar.gz" "$windows" | tee SHA256SUMS
          cp "$dir/licenses/LICENSE" LICENSE
          {
            echo "### $TAG"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish release ${{ env.TAG }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists"
            exit 1
          fi
          {
            echo "google/dawn $REV for Android ($(jq -r 'join(", ")' <<< "$ABIS")) and Windows x64, built from $GITHUB_SHA on $GITHUB_REF_NAME with:"
            echo
            ls "dawn-android-$REV/patches" | sed 's/^/- /'
            echo
            echo "Android: NDK $(jq -r .ndkVersion tactile/release.json), $(jq -r .androidPlatform tactile/release.json), Dawn's mobile CMake recipe. The patches are inside the archive."
            echo "Windows: windows-latest, MSVC 14.44, Windows SDK $WIN10_SDK_VERSION, Dawn's own CI recipe; the same layout as Google's Dawn-<rev>-windows-latest-Release.tar.gz."
            echo
            echo "Dawn is BSD-3-Clause (LICENSE). Each archive's licenses/ folder holds the notices of Dawn and of every third-party component compiled into it."
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title "$TAG" --notes-file notes.md \
            "dawn-android-$REV.tar.gz" "Dawn-$REV-windows-latest-Release.tar.gz" SHA256SUMS LICENSE
